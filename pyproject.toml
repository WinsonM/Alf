[project]
name = "alf"
version = "0.1.0"
description = "Personal agent: Jev decisions, local speech recognition, SQLite memory"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.1",
    "faster-whisper>=1.2",
    "sounddevice>=0.5",
    "numpy",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "holidays>=0.108",
    "lunar-python>=1.4.9",
]

[project.scripts]
alf = "alf.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
