<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 772" width="960" height="772" role="img" aria-labelledby="t d">
  <title id="t">Alf 架构图</title>
  <desc id="d">入口（iMessage、Alf.app 和网页、终端）连到这台 Mac 上常驻的 Alf 后台服务；服务内部分接入、主线（对话和心跳）、能力、存储四层；向下连模型（DeepSeek、Jev、Whisper）和外部来源（邮箱、日历和提醒事项、MCP 服务器）。</desc>
  <style>
    svg {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --group: #f6f8fa; --box: #ffffff;
      --blue: #0969da; --blue-bg: #f1f8ff; --blue-soft: #ddf4ff; --blue-line: #a5d6ff;
      --purple: #8250df; --purple-bg: #fbf7ff; --purple-line: #d8b9ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --line: #3d444d; --group: #151b23; --box: #0d1117;
        --blue: #58a6ff; --blue-bg: #0c1626; --blue-soft: #10284a; --blue-line: #1f4b82;
        --purple: #be8fff; --purple-bg: #151026; --purple-line: #4a3285;
      }
    }
    .card { fill: var(--bg); stroke: var(--line); }
    .group { fill: var(--group); stroke: var(--line); }
    .svc { fill: var(--blue-bg); stroke: var(--blue-line); }
    .models { fill: var(--purple-bg); stroke: var(--purple-line); }
    .box { fill: var(--box); stroke: var(--line); }
    .main { fill: var(--blue-soft); stroke: var(--blue-line); }
    .t { fill: var(--ink); font-size: 14px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 12px; font-weight: 400; }
    .f { fill: var(--muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .flow { fill: var(--ink); font-size: 12.5px; }
    .row { fill: var(--muted); font-size: 13px; font-weight: 600; }
    .svc-t { fill: var(--blue); font-size: 15px; font-weight: 700; }
    .main-t { fill: var(--blue); font-size: 15px; font-weight: 700; }
    .models-t { fill: var(--purple); font-size: 13px; font-weight: 600; }
    .arrow { stroke: var(--muted); stroke-width: 1.4; }
    .head { fill: var(--muted); }
  </style>
  <rect class="card" x="0.5" y="0.5" width="959" height="771" rx="14"/>

  <!-- 入口 -->
  <rect class="group" x="28" y="20" width="904" height="82" rx="14"/>
  <text class="row" x="52" y="66">入口</text>
  <rect class="box" x="104" y="32" width="260" height="58" rx="10"/>
  <text class="t" x="118" y="56">iPhone · iMessage</text>
  <text class="s" x="118" y="76">文字 · 语音 · 图片 · 引用回复</text>
  <rect class="box" x="380" y="32" width="260" height="58" rx="10"/>
  <text class="t" x="394" y="56">Alf.app · 网页</text>
  <text class="s" x="394" y="76">聊天 · 记忆 · 设置</text>
  <rect class="box" x="656" y="32" width="260" height="58" rx="10"/>
  <text class="t" x="670" y="56">终端</text>
  <text class="s" x="670" y="76">调试 · 自检</text>

  <!-- 入口 ↔ 后台服务 -->
  <line class="arrow" x1="234" y1="110" x2="234" y2="138"/>
  <path class="head" d="M234 104 l-4.5 7.5 h9 z M234 144 l-4.5 -7.5 h9 z"/>
  <text class="s" x="246" y="128">「信息」App</text>
  <line class="arrow" x1="510" y1="110" x2="510" y2="138"/>
  <path class="head" d="M510 104 l-4.5 7.5 h9 z M510 144 l-4.5 -7.5 h9 z"/>
  <text class="s" x="522" y="128">HTTP · 127.0.0.1:8765</text>
  <line class="arrow" x1="786" y1="110" x2="786" y2="138"/>
  <path class="head" d="M786 104 l-4.5 7.5 h9 z M786 144 l-4.5 -7.5 h9 z"/>
  <text class="s" x="798" y="128">uv run alf</text>

  <!-- Alf 后台服务 -->
  <rect class="svc" x="28" y="146" width="904" height="454" rx="14"/>
  <text x="48" y="173"><tspan class="svc-t">Alf 后台服务</tspan><tspan class="s" dx="12">在这台 Mac 上 · launchd 常驻 · 只监听 127.0.0.1</tspan></text>

  <!-- 接入 -->
  <text class="row" x="52" y="222">接入</text>
  <rect class="box" x="104" y="188" width="260" height="58" rx="10"/>
  <text class="t" x="118" y="212">iMessage 渠道</text>
  <text class="f" x="350" y="212" text-anchor="end">imessage.py</text>
  <text class="s" x="118" y="232">只读「信息」数据库 · AppleScript 发送</text>
  <rect class="box" x="380" y="188" width="260" height="58" rx="10"/>
  <text class="t" x="394" y="212">HTTP 接口和网页</text>
  <text class="f" x="626" y="212" text-anchor="end">server.py</text>
  <text class="s" x="394" y="232">同一个进程里起心跳和 iMessage 线程</text>
  <rect class="box" x="656" y="188" width="260" height="58" rx="10"/>
  <text class="t" x="670" y="212">命令行</text>
  <text class="f" x="902" y="212" text-anchor="end">cli.py</text>
  <text class="s" x="670" y="232">终端聊天 · 装成后台服务</text>

  <!-- 主线 -->
  <text class="row" x="52" y="307">主线</text>
  <rect class="main" x="104" y="260" width="398" height="84" rx="10"/>
  <text x="118" y="286"><tspan class="main-t">对话</tspan><tspan class="s" dx="10">你说话时</tspan></text>
  <text class="f" x="488" y="286" text-anchor="end">chat.py</text>
  <text class="flow" x="118" y="309">拼上下文 → 模型调工具 → 程序执行 → 核对 → 回复</text>
  <text class="s" x="118" y="329">办没办成由程序说了算，说「办好了」要对得上改动</text>
  <rect class="main" x="518" y="260" width="398" height="84" rx="10"/>
  <text x="532" y="286"><tspan class="main-t">心跳</tspan><tspan class="s" dx="10">没人说话时</tspan></text>
  <text class="f" x="902" y="286" text-anchor="end">heartbeat.py · jobs.py</text>
  <text class="flow" x="532" y="309">到期提醒 · 早报 · 追问 · 收信 · 日历同步 · 每晚汇总</text>
  <text class="s" x="532" y="329">没任务到点时不调模型、不联网</text>

  <!-- 能力 -->
  <text class="row" x="52" y="440">能力</text>
  <rect class="box" x="104" y="358" width="194" height="72" rx="10"/>
  <text class="t" x="116" y="381">时间</text>
  <text class="f" x="116" y="399">timeparse.py</text>
  <text class="s" x="116" y="417">日期一律由程序算</text>
  <rect class="box" x="310" y="358" width="194" height="72" rx="10"/>
  <text class="t" x="322" y="381">提醒和追问</text>
  <text class="f" x="322" y="399">reminders.py · followup.py</text>
  <text class="s" x="322" y="417">到点叫你 · 没回音问一次</text>
  <rect class="box" x="516" y="358" width="194" height="72" rx="10"/>
  <text class="t" x="528" y="381">记忆</text>
  <text class="f" x="528" y="399">memory.py · fts.py</text>
  <text class="s" x="528" y="417">三层 · 写入前比对</text>
  <rect class="box" x="722" y="358" width="194" height="72" rx="10"/>
  <text class="t" x="734" y="381">听了会改</text>
  <text class="f" x="734" y="399">lessons.py · prefs.py</text>
  <text class="s" x="734" y="417">要求 · 例子 · 设置</text>
  <rect class="box" x="104" y="440" width="194" height="72" rx="10"/>
  <text class="t" x="116" y="463">主动消息</text>
  <text class="f" x="116" y="481">proactive.py</text>
  <text class="s" x="116" y="499">硬规则 → 模型 → 把关</text>
  <rect class="box" x="310" y="440" width="194" height="72" rx="10"/>
  <text class="t" x="322" y="463">好感度和情绪</text>
  <text class="f" x="322" y="481">affinity.py · mood.py</text>
  <text class="s" x="322" y="499">决定语气的松紧</text>
  <rect class="box" x="516" y="440" width="194" height="72" rx="10"/>
  <text class="t" x="528" y="463">语音和图片</text>
  <text class="f" x="528" y="481">media.py · asr.py</text>
  <text class="s" x="528" y="499">转成文字和 JPEG</text>
  <rect class="box" x="722" y="440" width="194" height="72" rx="10"/>
  <text class="t" x="734" y="463">把关</text>
  <text class="f" x="734" y="481">decide.py</text>
  <text class="s" x="734" y="499">是不是 · 选哪个</text>

  <!-- 存储 -->
  <text class="row" x="52" y="560">存储</text>
  <rect class="box" x="104" y="526" width="812" height="58" rx="10"/>
  <text class="t" x="118" y="550">SQLite</text>
  <text class="f" x="902" y="550" text-anchor="end">db.py · data/alf.db</text>
  <text class="s" x="118" y="570">时间线 · 记忆 · 提醒 · 设置 · 学到的 · 邮件 · 日历快照 · 任务状态 · 模型调用记录</text>

  <!-- 后台服务 ↔ 模型、外部来源 -->
  <line class="arrow" x1="248" y1="608" x2="248" y2="636"/>
  <path class="head" d="M248 602 l-4.5 7.5 h9 z M248 642 l-4.5 -7.5 h9 z"/>
  <text class="f" x="260" y="626">llm.py · decide.py · asr.py</text>
  <line class="arrow" x1="712" y1="608" x2="712" y2="636"/>
  <path class="head" d="M712 602 l-4.5 7.5 h9 z M712 642 l-4.5 -7.5 h9 z"/>
  <text class="f" x="724" y="626">connectors/ · apple.py · sources.py</text>

  <!-- 模型 -->
  <rect class="models" x="28" y="644" width="440" height="108" rx="14"/>
  <text class="models-t" x="42" y="668">模型</text>
  <rect class="box" x="42" y="680" width="130" height="58" rx="10"/>
  <text class="t" x="54" y="704">DeepSeek</text>
  <text class="s" x="54" y="724">听懂 · 措辞 · 看图</text>
  <rect class="box" x="182" y="680" width="130" height="58" rx="10"/>
  <text class="t" x="194" y="704">Jev（可选）</text>
  <text class="s" x="194" y="724">是不是 · 选哪个</text>
  <rect class="box" x="322" y="680" width="130" height="58" rx="10"/>
  <text class="t" x="334" y="704">Whisper</text>
  <text class="s" x="334" y="724">本机 · 语音转文字</text>

  <!-- 外部来源 -->
  <rect class="group" x="492" y="644" width="440" height="108" rx="14"/>
  <text class="row" x="506" y="668">外部来源</text>
  <rect class="box" x="506" y="680" width="130" height="58" rx="10"/>
  <text class="t" x="518" y="704">邮箱</text>
  <text class="s" x="518" y="724">Gmail · 163 · QQ</text>
  <rect class="box" x="646" y="680" width="130" height="58" rx="10"/>
  <text class="t" x="658" y="704">日历 · 提醒事项</text>
  <text class="s" x="658" y="724">EventKit 读写</text>
  <rect class="box" x="786" y="680" width="130" height="58" rx="10"/>
  <text class="t" x="798" y="704">MCP 服务器</text>
  <text class="s" x="798" y="724">特殊日子 · 新闻</text>
</svg>
